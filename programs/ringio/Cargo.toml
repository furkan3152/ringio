[package]
name = "ringio"
version = "0.2.0"
description = "Invite-only, collateralized ROSCA program for Solana (Pinocchio, Anchor-compatible interface)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "ringio"

[features]
default = []
# Build the library without the program entrypoint (for embedding/tests).
no-entrypoint = []
# Skip the Anchor-compatible event logs to shave a few kilobytes and compute units.
no-events = []

[dependencies]
pinocchio = "=0.9.3"
pinocchio-pubkey = "=0.3.0"
pinocchio-system = "=0.4.0"
pinocchio-token = "=0.4.0"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
