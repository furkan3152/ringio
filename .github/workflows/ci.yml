name: Ringio checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Shipped (production) dependencies must be free of high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_DEFAULT_CLUSTER: devnet

  svm:
    name: SBF build, size budget, and Anchor equivalence (LiteSVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGAVE_VERSION: v2.3.13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}
      # Keeps the original Anchor bytecode (the differential reference) after
      # devnet is upgraded to the Pinocchio build.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: web/.cache/ringio-anchor-reference.so
          key: ringio-anchor-reference-c6a8367a
      - name: Install Agave CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo build-sbf --manifest-path programs/ringio/Cargo.toml
      - run: npm ci
        working-directory: web
      - name: Program size budget (deployment rent scales with it)
        run: npm run program:cost -- --max-bytes 100000
        working-directory: web
      # Runs the UI's instruction builders through full lifecycles on the local
      # build, and the differential suite against the original Anchor bytecode.
      - run: npm run test:svm
        working-directory: web

  program:
    name: Program format and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p ringio
      - run: cargo clippy -p ringio --all-targets -- -D warnings
